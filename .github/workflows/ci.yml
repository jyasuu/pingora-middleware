## ci.yml — Fast feedback on every push / PR
##
## Jobs
##   fmt       — cargo fmt check (fails fast, no compile needed)
##   clippy    — cargo clippy -D warnings
##   unit      — cargo test (excludes integration_test_e2e)
##
## Rust toolchain and compiled artefacts are cached via actions/cache so
## repeat runs on the same commit are near-instant.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  # ── 1. Format check (no compile, very fast) ───────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── 2. Clippy ─────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system deps (openssl, cmake)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake gcc make pkg-config libssl-dev

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── 3. Unit tests (no Docker) ─────────────────────────────────────────────
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake gcc make pkg-config libssl-dev

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-unit-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-unit-

      - name: cargo test (unit only — exclude e2e)
        run: |
          cargo test \
            --lib \
            --test integration_test \
            -- --nocapture
        # integration_test.rs contains the unit-level ACL/token/canary tests.
        # integration_test_e2e.rs requires Docker and is excluded here.

## Integration-test stack
##
## Services
##   mock-jwks  – Python OIDC/JWKS server (RSA-signed JWTs).
##                Supports grant_type=password (user tests) and
##                grant_type=client_credentials (M2M tests).
##                Also exposes /introspect for strategy=introspect runs.
##   whoami     – traefik/whoami; echoes every request header back in the
##                response body so tests can assert forwarded headers.
##   redis      – rate-limiter store (same config as prod).
##   pingora    – proxy under test.
##                CI: set PINGORA_IMAGE=pingora-middleware:integration to use
##                    a pre-built image and skip rebuilding inside compose.
##                Local: omit PINGORA_IMAGE and compose builds from source.
##
## Usage (local):
##   make integration-test
##
## Usage (CI — pre-built image):
##   PINGORA_IMAGE=pingora-middleware:integration \
##   docker compose -f deploy/docker/docker-compose.integration.yml \
##     up -d --no-build --wait

name: pingora-integration

services:

  # ── Mock OIDC / JWKS server ──────────────────────────────────────────────────
  mock-jwks:
    image: python:3.12-slim
    command: python /app/mock_jwks.py
    volumes:
      - ../../tests/mock_jwks.py:/app/mock_jwks.py:ro
    ports:
      - "8888:8888"
    networks:
      - dmz
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8888/.well-known/openid-configuration')"
      interval: 4s
      timeout: 4s
      retries: 15
      start_period: 12s   # pip install cryptography + PyJWT on cold image

  # ── traefik/whoami: echoes request headers in response body ──────────────────
  whoami:
    image: traefik/whoami:latest
    networks:
      - intranet

  # ── Redis (rate-limiter) ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      - dmz

  # ── Pingora proxy ─────────────────────────────────────────────────────────────
  # PINGORA_IMAGE env var: set to a pre-built tag in CI to skip rebuild.
  # When PINGORA_IMAGE is empty, compose uses the build section (local dev).
  pingora:
    image: ${PINGORA_IMAGE:-pingora-middleware:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "6191:6191"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      INTERNAL_SERVICE_TOKEN: integration-token

      # Redis
      REDIS_URL: redis://redis:6379/
      RATE_LIMIT_REQUESTS: 10000
      RATE_LIMIT_WINDOW_S: 60

      # OAuth2 — point at the mock server
      OAUTH2_STRATEGY: jwks
      OIDC_ISSUER: http://mock-jwks:8888
      OIDC_AUDIENCE: test-client
      OIDC_CLIENT_ID: test-client
      OIDC_REDIRECT_URI: http://localhost/callback
      OIDC_REQUIRED_SCOPES: api:read

      # Skip discovery on first boot — use JWKS endpoint directly
      JWKS_URI: http://mock-jwks:8888/jwks
      JWKS_REFRESH_SECS: 3600

      # 60 s leeway; expired tokens with exp_in=-120 are still rejected
      OAUTH2_CLOCK_SKEW_SECS: 60

    depends_on:
      redis:
        condition: service_healthy
      mock-jwks:
        condition: service_healthy
      whoami:
        condition: service_started
    networks:
      - dmz
      - intranet
    restart: "no"
    healthcheck:
      # A 401 means Pingora is up and enforcing auth (correct behaviour)
      test: ["CMD", "sh", "-c",
             "curl -s -o /dev/null -w '%{http_code}' http://localhost:6191/api/healthz | grep -q 401"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

networks:
  dmz:
    driver: bridge
  intranet:
    driver: bridge
    internal: true
